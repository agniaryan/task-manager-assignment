<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h2 class="main-heading">
            Team Task Manager
        </h2>

        <h3 class="sub-heading">
            Login
        </h3>

        <table class="form-table">

            <tr>

                <td>Email</td>

                <td>

                    <input
                            type="email"
                            id="email"
                            placeholder="Enter Email"
                    >

                </td>

            </tr>

            <tr>

                <td>Password</td>

                <td>

                    <input
                            type="password"
                            id="password"
                            placeholder="Enter Password"
                    >

                </td>

            </tr>

            <tr>

                <td>Role</td>

                <td>

                    <select id="role">

                        <option value="ADMIN">
                            ADMIN
                        </option>

                        <option value="MEMBER">
                            MEMBER
                        </option>

                    </select>

                </td>

            </tr>

        </table>

        <button onclick="login()">

            Login

        </button>

        <p class="bottom-text">

            Don't have account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
